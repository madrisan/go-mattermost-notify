name: golangci-lint

on:
  push:
    paths-ignore:
      - '**.md'
      - 'images/**'
  pull_request:
    types: [assigned, edited, opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: false
      - uses: actions/checkout@v7
      - name: golangci-lint
        # golangci-lint-action >= v7 dropped support for golangci-lint v1.x
        # (the `version: v1.64` pin below); stay on the last v6.x release
        # until this project migrates its lint config to golangci-lint v2.
        uses: golangci/golangci-lint-action@v6.5.2
        with:
          # The version of golangci-lint is required and must be specified
          # without patch version: we always use the latest patch version.
          version: v1.64
          skip-cache: true
